name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instant
          POSTGRES_PASSWORD: instant
          POSTGRES_DB: instant_discount_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U instant" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://instant:instant@localhost:5432/instant_discount_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @instant-discount/db validate
      - run: pnpm turbo run build typecheck test
      # Fails if docs/api differs from what the code generates.
      - run: pnpm turbo run docs:check

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate the chart for each environment
        run: |
          for env in staging production; do
            echo "::group::$env"
            helm lint deploy/helm/instant-discount -f deploy/environments/$env/values.yaml
            helm template instant-discount deploy/helm/instant-discount -f deploy/environments/$env/values.yaml \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
            echo "::endgroup::"
          done

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
