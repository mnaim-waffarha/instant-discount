# Continuous delivery through GitOps:
#   push to main  → build + push images → pin their digests in deploy/environments/staging → Argo CD syncs staging
#   tag v*        → (approval in the "production" environment) re-tag the same images → pin in production
#
# Requires: repository variable REGISTRY (e.g. registry.waffarha.com/instant-discount) and secrets
# REGISTRY_USERNAME / REGISTRY_PASSWORD. Without REGISTRY the jobs are skipped.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['deploy/environments/**', 'docs/**', '**/*.md']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  staging:
    if: github.ref == 'refs/heads/main' && vars.REGISTRY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ vars.REGISTRY }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ vars.REGISTRY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Pin the new images for staging
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          f=deploy/environments/staging/values.yaml
          yq -i '.image.registry = strenv(REGISTRY) | .api.image.tag = strenv(GITHUB_SHA) | .api.image.digest = strenv(API_DIGEST) | .web.image.tag = strenv(GITHUB_SHA) | .web.image.digest = strenv(WEB_DIGEST)' "$f"
          git config user.name "instant-discount-release"
          git config user.email "release-bot@users.noreply.github.com"
          git add "$f"
          git commit -m "deploy(staging): ${GITHUB_SHA::7} [skip ci]"
          git push
        # yq is preinstalled on GitHub-hosted runners.
        shell: bash
    env:
      REGISTRY: ${{ vars.REGISTRY }}

  production:
    if: startsWith(github.ref, 'refs/tags/v') && vars.REGISTRY != ''
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in the repository settings.
    environment: production
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Promote exactly what staging is running (no rebuild)
        shell: bash
        run: |
          set -euo pipefail
          # The tag is the release label; the images are the ones staging was tested with.
          for app in api web; do
            staged=$(yq ".${app}.image.tag" deploy/environments/staging/values.yaml)
            if [ "$staged" = "bootstrap" ]; then echo "::error::staging has no released $app image yet"; exit 1; fi
            docker buildx imagetools create -t "$REGISTRY/$app:${GITHUB_REF_NAME}" "$REGISTRY/$app:$staged"
            digest=$(docker buildx imagetools inspect "$REGISTRY/$app:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)
            export TAG="${GITHUB_REF_NAME}" DIGEST="$digest"
            yq -i ".image.registry = strenv(REGISTRY) | .${app}.image.tag = strenv(TAG) | .${app}.image.digest = strenv(DIGEST)" deploy/environments/production/values.yaml
          done
          git config user.name "instant-discount-release"
          git config user.email "release-bot@users.noreply.github.com"
          git add deploy/environments/production/values.yaml
          git commit -m "deploy(production): ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
