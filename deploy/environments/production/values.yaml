# Production. Image digests are promoted by .github/workflows/release.yml on a v* tag after
# approval in the GitHub "production" environment; Argo CD sync is manual.
image:
  registry: registry.example.com/instant-discount

api:
  image: { repository: api, tag: bootstrap, digest: '' }
  autoscaling:
    { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 60 }
  resources:
    requests: { cpu: 500m, memory: 384Mi }
    limits: { memory: 768Mi }

worker:
  replicas: 2

web:
  image: { repository: web, tag: bootstrap, digest: '' }
  replicas: 2

config:
  WEB_BASE_URL: https://instant-discount.example.com

ingress:
  acquirer:
    host: acquirer.instant-discount.example.com
    annotations:
      nginx.ingress.kubernetes.io/auth-tls-secret: instant-discount/acquirer-client-ca
      # Set to the acquirers' egress IPs, comma-separated.
      nginx.ingress.kubernetes.io/whitelist-source-range: ''
  web:
    host: instant-discount.example.com

serviceMonitor:
  enabled: true
