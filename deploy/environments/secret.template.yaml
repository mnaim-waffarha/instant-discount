# TEMPLATE ONLY — never commit this file with real values.
# Fill in, then seal it for the target cluster (see deploy/README.md):
#   kubeseal --format yaml --namespace <ns> < secret.yaml > environments/<env>/secrets/instant-discount-secrets.sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: instant-discount-secrets
  namespace: <ns>
type: Opaque
stringData:
  # postgresql://user:password@host:5432/instant_discount?sslmode=require&connection_limit=10
  DATABASE_URL: ''
  # rediss://:password@host:6380  (TLS)
  REDIS_URL: ''
  # Random, long; rotating it resets per-card history.
  CARD_TOKEN_PEPPER: ''
  # 32 random bytes, base64 (openssl rand -base64 32). Back it up: it decrypts acquirer secrets.
  SECRETS_ENCRYPTION_KEY: ''
  GOOGLE_CLIENT_ID: ''
  SMTP_URL: ''
  SLACK_WEBHOOK_URL: ''
  METRICS_TOKEN: ''
