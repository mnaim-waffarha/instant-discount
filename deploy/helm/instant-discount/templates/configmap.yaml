apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "id.fullname" . }}-config
  labels:
    {{- include "id.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  PORT: {{ .Values.api.port | quote }}
  WORKER_PORT: {{ .Values.worker.port | quote }}
