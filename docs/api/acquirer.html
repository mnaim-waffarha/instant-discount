    <script>
      Redoc.init({"openapi":"3.1.0","info":{"title":"Waffarha Instant Discount — Acquirer API","version":"1.0.0","description":"Called by acquirers / payment providers while a card payment is in progress at a POS.\n\n## Flow\n1. **Inquire** before charging the card. If `eligible` is true, charge `final_amount`.\n2. **Confirm** once the charge succeeds, or **Cancel** if it is declined or voided.\n   A reservation that is neither confirmed nor cancelled expires after `expires_at`\n   (default 10 minutes) and its budget is released.\n3. **Refund** (full or partial) when the merchant refunds the purchase later.\n\n## Timeouts — fail open\nUse a client timeout of **800 ms** on inquire. On timeout, any error or `eligible: false`,\ncharge the full amount. Never block the payment because of this API.\nIf you charged the full amount after a timeout, do nothing: the reservation expires on its own.\n\n## Amounts\nAll amounts are integers in **minor units** (piastres for EGP, halalas for SAR): 125.50 EGP = `12550`.\n\n## Authentication\nEvery request is sent over mTLS and carries:\n- `X-Api-Key`: your key id\n- `X-Timestamp`: unix time in seconds; requests more than 300 s off are rejected\n- `X-Signature`: lowercase hex of\n  `HMAC-SHA256(secret, timestamp + \"\\n\" + METHOD + \"\\n\" + path + \"\\n\" + hex(SHA256(raw body)))`,\n  where `path` is the request path including any query string, e.g. `/v1/discounts/inquire`.\n\n## Card data\nSend the card **BIN** (first 6–8 digits) and your **card token** (stable per card).\nNever send the full card number (PAN); requests that look like they contain one are rejected.\n\n## Idempotency\n`inquire` requires an `Idempotency-Key` header (use your transaction reference). Retrying with\nthe same key returns the original answer. Confirm and cancel are naturally idempotent; refund is\nidempotent per `refund_id`.\n\n## Errors\nEvery error has the shape `{ \"error\": { \"code\": \"...\", \"message\": \"...\" } }`. Only a valid\n`200` from inquire with `eligible: true` means a discount applies; treat anything else\n(including network errors and timeouts) as \"no discount\".\n","license":{"name":"Proprietary — Waffarha"}},"servers":[{"url":"https://{host}","variables":{"host":{"default":"sandbox.example.com","description":"Provided per environment during onboarding"}}}],"tags":[{"name":"Discounts","description":"Inquire, then confirm, cancel or refund."}],"components":{"securitySchemes":{"AcquirerHmac":{"type":"apiKey","in":"header","name":"X-Api-Key","description":"Your key id. Every request also carries `X-Timestamp` and `X-Signature` (HMAC-SHA256, see the overview) and is sent over mTLS from an allow-listed IP."}},"schemas":{"Eligible":{"type":"object","properties":{"eligible":{"type":"boolean","const":true},"redemption_id":{"type":"string","format":"uuid"},"campaign_id":{"type":"string","format":"uuid"},"original_amount":{"type":"integer","description":"Integer minor units"},"discount_amount":{"type":"integer","description":"Integer minor units"},"final_amount":{"type":"integer","description":"Charge this amount"},"currency":{"type":"string","enum":["EGP","SAR"]},"expires_at":{"type":"string","description":"Confirm before this time","format":"date-time"},"display_message":{"anyOf":[{"type":"string","description":"Optional text for the POS screen / receipt"},{"type":"null"}]},"display_message_ar":{"anyOf":[{"type":"string"},{"type":"null"}]}},"required":["eligible","redemption_id","campaign_id","original_amount","discount_amount","final_amount","currency","expires_at","display_message","display_message_ar"],"description":"A discount applies and has been reserved."},"Error":{"type":"object","properties":{"error":{"type":"object","properties":{"code":{"type":"string","description":"Machine-readable code, e.g. VALIDATION_ERROR, CAMPAIGN_NOT_FOUND"},"message":{"type":"string","description":"Human-readable explanation"}},"required":["code","message"]}},"required":["error"],"description":"Every error response has this shape."},"NotEligible":{"type":"object","properties":{"eligible":{"type":"boolean","const":false},"reason":{"type":"string","description":"Why no discount applies. Charge the full amount in every case. Holdout cards of an experiment get NO_ELIGIBLE_CAMPAIGN.","enum":["UNKNOWN_TERMINAL","TERMINAL_INACTIVE","NO_ELIGIBLE_CAMPAIGN","LIMITS_REACHED","VELOCITY_LIMIT","KILL_SWITCH","UNAVAILABLE"]}},"required":["eligible","reason"],"description":"No discount: charge the full amount."},"RedemptionStatus":{"type":"string","enum":["RESERVED","CONFIRMED","RELEASED","EXPIRED","PARTIALLY_REFUNDED","REFUNDED"]},"RedemptionView":{"type":"object","properties":{"redemption_id":{"type":"string","format":"uuid"},"status":{"$ref":"#/components/schemas/RedemptionStatus"},"campaign_id":{"type":"string","format":"uuid"},"currency":{"type":"string","enum":["EGP","SAR"]},"original_amount":{"type":"integer","description":"Integer minor units"},"discount_amount":{"type":"integer","description":"Integer minor units"},"final_amount":{"type":"integer","description":"Integer minor units"},"refunded_amount":{"type":"integer","description":"Integer minor units"},"refunded_discount_amount":{"type":"integer","description":"Integer minor units"}},"required":["redemption_id","status","campaign_id","currency","original_amount","discount_amount","final_amount","refunded_amount","refunded_discount_amount"],"description":"Current state of a redemption, as the acquirer sees it."}},"parameters":{}},"paths":{"/v1/discounts/{id}/cancel":{"post":{"tags":["Discounts"],"summary":"The charge was declined or voided: release the discount","description":"Allowed before or after confirmation, but not after a refund.","operationId":"cancelDiscount","security":[{"AcquirerHmac":[]}],"parameters":[{"schema":{"type":"string","description":"The `redemption_id` returned by inquire"},"required":true,"name":"id","in":"path"}],"requestBody":{"required":false,"content":{"application/json":{"schema":{"type":"object","properties":{"reason":{"type":"string","maxLength":128,"description":"Why the charge failed (logged)"}},"default":{}}}}},"responses":{"200":{"description":"The charge was declined or voided: release the discount","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RedemptionView"}}}},"400":{"description":"VALIDATION_ERROR: the message lists every invalid field","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Missing or invalid signature, timestamp, API key or source IP","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"REDEMPTION_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"USE_REFUND: already refunded","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1/discounts/{id}/confirm":{"post":{"tags":["Discounts"],"summary":"The discounted charge succeeded","description":"`charged_amount` must equal `final_amount`. Confirming twice returns the same result.","operationId":"confirmDiscount","security":[{"AcquirerHmac":[]}],"parameters":[{"schema":{"type":"string","description":"The `redemption_id` returned by inquire"},"required":true,"name":"id","in":"path"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"charged_amount":{"type":"integer","minimum":0,"description":"Amount charged, minor units. Must equal final_amount."},"auth_code":{"type":"string","maxLength":32,"description":"Authorisation code from the issuer"}},"required":["charged_amount"]},"example":{"charged_amount":40000,"auth_code":"A1B2C3"}}}},"responses":{"200":{"description":"The discounted charge succeeded","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RedemptionView"}}}},"400":{"description":"VALIDATION_ERROR: the message lists every invalid field","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Missing or invalid signature, timestamp, API key or source IP","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"REDEMPTION_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"REDEMPTION_CANCELLED or RESERVATION_EXPIRED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"AMOUNT_MISMATCH: charged_amount differs from final_amount (cancel instead)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1/discounts/{id}/refund":{"post":{"tags":["Discounts"],"summary":"Refund all or part of a confirmed purchase","description":"The discount is reversed in the same proportion as the refund. Repeating a `refund_id` is a no-op.","operationId":"refundDiscount","security":[{"AcquirerHmac":[]}],"parameters":[{"schema":{"type":"string","description":"The `redemption_id` returned by inquire"},"required":true,"name":"id","in":"path"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"refund_id":{"type":"string","minLength":1,"maxLength":64,"description":"Your unique refund id; repeating it is a no-op"},"amount":{"type":"integer","minimum":0,"description":"Amount returned to the customer, minor units, out of final_amount"}},"required":["refund_id","amount"]},"example":{"refund_id":"RF-0001","amount":20000}}}},"responses":{"200":{"description":"Refund all or part of a confirmed purchase","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RedemptionView"}}}},"400":{"description":"VALIDATION_ERROR: the message lists every invalid field","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Missing or invalid signature, timestamp, API key or source IP","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"REDEMPTION_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"NOT_CONFIRMED or ALREADY_REFUNDED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"REFUND_EXCEEDS_PAID: total refunds would exceed what the customer paid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}},"/v1/discounts/inquire":{"post":{"tags":["Discounts"],"summary":"Ask whether a discount applies, and reserve it","description":"Call before charging the card, with an 800 ms client timeout. If `eligible` is true, charge `final_amount` and confirm; otherwise charge the full amount.","operationId":"inquireDiscount","security":[{"AcquirerHmac":[]}],"parameters":[{"schema":{"type":"string","maxLength":128,"description":"Your transaction reference; retries with the same key return the original answer"},"required":true,"name":"Idempotency-Key","in":"header"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"terminal_id":{"type":"string","minLength":1,"maxLength":64,"description":"Terminal id (TID) as registered with Waffarha"},"merchant_id":{"type":"string","maxLength":64,"description":"Your merchant id (MID), informational only"},"bin":{"type":"string","pattern":"^\\d{6,8}$","description":"First 6–8 digits of the card number"},"card_token":{"type":"string","minLength":8,"maxLength":256,"description":"Your stable token for the card. Never the card number (PAN)."},"scheme":{"type":"string","enum":["VISA","MASTERCARD","MEEZA","MADA","AMEX"]},"amount":{"type":"integer","exclusiveMinimum":0,"description":"Purchase amount before discount, minor units"},"currency":{"type":"string","enum":["EGP","SAR"]},"acquirer_txn_ref":{"type":"string","minLength":1,"maxLength":64,"description":"Your transaction reference"}},"required":["terminal_id","bin","card_token","scheme","amount","currency","acquirer_txn_ref"]},"example":{"terminal_id":"TID0001","merchant_id":"MID-778","bin":"412345","card_token":"tok_4f9c2a71b3","scheme":"VISA","amount":50000,"currency":"EGP","acquirer_txn_ref":"TXN-2026-000123"}}}},"responses":{"200":{"description":"Decision. Always 200 for a valid request, eligible or not.","content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/Eligible"},{"$ref":"#/components/schemas/NotEligible"}]},"example":{"eligible":true,"redemption_id":"3f0d6c1e-8a2b-4c7d-9e10-5b6a7c8d9e0f","campaign_id":"45781692-824b-4d65-9d5b-c8a63bc12162","original_amount":50000,"discount_amount":10000,"final_amount":40000,"currency":"EGP","expires_at":"2026-10-28T10:10:00.000Z","display_message":"Demo Bank 20% off","display_message_ar":"خصم 20% من بنك ديمو"}}}},"400":{"description":"VALIDATION_ERROR: the message lists every invalid field","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Missing or invalid signature, timestamp, API key or source IP","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"IDEMPOTENCY_IN_PROGRESS: the same Idempotency-Key is still being processed","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"IDEMPOTENCY_KEY_REUSED: the Idempotency-Key was used with a different body","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}}}, {
