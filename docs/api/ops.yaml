# Generated by `pnpm --filter @instant-discount/api docs:api`. Do not edit by hand.
openapi: 3.1.0
info:
  title: Waffarha Instant Discount — Operations
  version: 1.0.0
  description: |-
    Endpoints for Kubernetes probes and Prometheus. The worker process serves the same three
    paths on `WORKER_PORT` (default 3010).
  license:
    name: Proprietary — Waffarha
servers:
  - url: /
    description: API (port 3000) or worker (WORKER_PORT)
tags:
  - name: Health
    description: Kubernetes readiness and liveness probes.
  - name: Metrics
    description: Prometheus scrape endpoint.
components:
  securitySchemes:
    MetricsToken:
      type: http
      scheme: bearer
      description: Required only when METRICS_TOKEN is set.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable code, e.g. VALIDATION_ERROR, CAMPAIGN_NOT_FOUND
            message:
              type: string
              description: Human-readable explanation
          required:
            - code
            - message
      required:
        - error
      description: Every error response has this shape.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        db:
          type: string
          enum:
            - ok
            - down
        redis:
          type: string
          enum:
            - ok
            - down
      required:
        - status
        - db
        - redis
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: "Readiness: database and Redis reachable"
      description: Returns 503 with the same body when a dependency is down.
      operationId: health_check
      security: []
      responses:
        "200":
          description: "Readiness: database and Redis reachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is down (body is the same Health object)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/live:
    get:
      tags:
        - Health
      summary: "Liveness: the process is up"
      description: Ignores dependencies on purpose, so a database blip does not restart pods.
      operationId: health_live
      security: []
      responses:
        "200":
          description: "Liveness: the process is up"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: "Prometheus text format. When `METRICS_TOKEN` is set, send `Authorization: Bearer <token>`. Keep it on the internal network."
      operationId: metrics_scrape
      security:
        - MetricsToken: []
        - {}
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Metrics token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
