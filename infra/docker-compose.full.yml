# Whole stack for staging or a local end-to-end run:
#   cp .env.example .env   # set real secrets
#   docker compose -f infra/docker-compose.full.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instant
      POSTGRES_PASSWORD: instant
      POSTGRES_DB: instant_discount
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'instant']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Counters are rebuilt from Postgres if lost, but persistence avoids needless rebuilds.
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  migrate:
    build: &api-build { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: instant-discount-api
    env_file: ../.env
    environment: &db
      DATABASE_URL: postgresql://instant:instant@postgres:5432/instant_discount
      REDIS_URL: redis://redis:6379
    working_dir: /repo/packages/db
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: *api-build
    image: instant-discount-api
    env_file: ../.env
    environment:
      <<: *db
      TRUST_PROXY: 'true'
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: *api-build
    image: instant-discount-api
    env_file: ../.env
    environment: *db
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_DEV_LOGIN: ${NEXT_PUBLIC_DEV_LOGIN:-false}
    environment:
      API_URL: http://api:3000
    ports: ['3001:3001']
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3002:3000']
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
